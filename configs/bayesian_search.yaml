# Set model_name to whatever Member 2's measured results selected (not assumed).
model_name: lightgbm        # lightgbm | random_forest | logistic_regression | knn | mlp
n_trials: 50
n_splits: 5
seed: 42
objective: candidate_table_top1    # candidate_table_top1 (requires observation_idx) | macro_f1
cv_strategy: stratified_group_kfold   # or group_kfold
threshold: 0.5
timeout_seconds: null
storage: null               # e.g. sqlite:///results/optuna.db
study_name: pathsnap_bayes
# Optional override of the built-in search space, e.g.
# search_space:
#   n_estimators: {type: int, low: 100, high: 500}
#   learning_rate: {type: float, low: 0.01, high: 0.2, log: true}
search_space: {}
