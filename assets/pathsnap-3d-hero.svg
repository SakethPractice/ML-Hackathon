<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">PathSnap - 3D isometric map matching project banner</title>
<desc id="desc">A stylized isometric city street network with a luminous reconstructed route and offset GPS observations. PathSnap is a work-in-progress machine learning map matching project.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07101F"/><stop offset=".53" stop-color="#0B1730"/><stop offset="1" stop-color="#122440"/></linearGradient>
  <radialGradient id="glow" cx="76%" cy="50%" r="56%"><stop offset="0" stop-color="#1A6381" stop-opacity=".32"/><stop offset="1" stop-color="#1A6381" stop-opacity="0"/></radialGradient>
  <linearGradient id="tileTop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#213653"/><stop offset="1" stop-color="#14283E"/></linearGradient>
  <linearGradient id="tileLeft" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1D3450"/><stop offset="1" stop-color="#0A1428"/></linearGradient>
  <linearGradient id="tileRight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#182A44"/><stop offset="1" stop-color="#070F1D"/></linearGradient>
  <linearGradient id="pathGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4CF2C8"/><stop offset="1" stop-color="#33B6FF"/></linearGradient>
  <filter id="shadow" x="-35%" y="-50%" width="170%" height="210%"><feGaussianBlur stdDeviation="17"/></filter>
  <filter id="routeGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="softGlow" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="5"/></filter>
  <clipPath id="tileClip"><polygon points="868.0,145.3 1154.4,277.0 868.0,408.7 581.6,277.0"/></clipPath>
  <pattern id="stars" width="48" height="48" patternUnits="userSpaceOnUse"><circle cx="7" cy="10" r=".75" fill="#82C6EE" opacity=".18"/></pattern>
</defs>
